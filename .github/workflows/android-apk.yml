
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract game ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -name 'village-barber-simulator-development.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "Game ZIP not found"
            exit 1
          fi
          mkdir project
          unzip -q "$ZIP" -d project

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        working-directory: project
        run: |
          npm ci
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build game
        working-directory: project
        run: |
          echo '{"appId":"com.village.barber","appName":"Village Barber Simulator","webDir":"dist"}' > capacitor.config.json
          npm run build

      - name: Prepare Android
        working-directory: project
        run: |
          npx cap add android
          npx cap sync android

      - name: Compile APK
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Village-Barber-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
